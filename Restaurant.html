<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foodie's Restaurant</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        /*======================================
        GOOGLE FONTS
======================================*/

@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap');

/*======================================
        CSS VARIABLES
======================================*/

:root{

    --primary:#d62828;
    --secondary:#ffb703;
    --dark:#1b1b1b;
    --white:#ffffff;
    --light:#f8f8f8;
    --gray:#666666;
    --shadow:0 10px 30px rgba(0,0,0,.12);

}

/*======================================
        RESET
======================================*/

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:'Poppins',sans-serif;
    background:var(--light);
    color:var(--dark);
    overflow-x:hidden;
}

img{
    width:100%;
    display:block;
}

a{
    text-decoration:none;
}

ul{
    list-style:none;
}

button,
input,
textarea,
select{
    font-family:'Poppins',sans-serif;
}

/*======================================
        REUSABLE CLASSES
======================================*/

.container{
    width:90%;
    max-width:1200px;
    margin:auto;
}

section{
    padding:100px 0;
}

.section-tag{
    color:var(--primary);
    font-size:15px;
    font-weight:700;
    letter-spacing:2px;
    text-transform:uppercase;
}

.section-title{
    text-align:center;
    margin-bottom:70px;
}

.section-title h2{
    font-size:48px;
    font-family:'Playfair Display',serif;
    margin:15px 0;
}

.section-title p{
    max-width:650px;
    margin:auto;
    color:var(--gray);
    line-height:1.8;
}

/*======================================
        BUTTONS
======================================*/

.primary-btn,
.btn{

    display:inline-block;
    padding:16px 38px;
    background:var(--primary);
    color:var(--white);
    border-radius:50px;
    font-weight:600;
    transition:.4s;

}

.primary-btn:hover,
.btn:hover{

    background:#b71c1c;
    transform:translateY(-4px);

}

.secondary-btn{

    display:inline-block;
    padding:16px 38px;
    border:2px solid var(--white);
    color:var(--white);
    border-radius:50px;
    font-weight:600;
    transition:.4s;

}

.secondary-btn:hover{

    background:var(--white);
    color:var(--dark);

}

/*======================================
        HEADER
======================================*/

header{

    position:fixed;
    top:0;
    left:0;
    width:100%;
    z-index:1000;
    background:rgba(0,0,0,.35);
    backdrop-filter:blur(12px);

}

nav{

    display:flex;
    justify-content:space-between;
    align-items:center;
    height:85px;

}

.logo h2{

    color:var(--white);
    font-size:34px;
    font-family:'Playfair Display',serif;

}

.nav-links{

    display:flex;
    gap:35px;

}

.nav-links a{

    color:var(--white);
    font-weight:500;
    transition:.3s;

}

.nav-links a:hover,
.nav-links .active{

    color:var(--secondary);

}

/*======================================
        HERO SECTION
======================================*/

.hero{

    min-height:100vh;

    background:
    linear-gradient(rgba(0,0,0,.65),
    rgba(0,0,0,.65)),
    url("images/restaurant-bg.jpg");

    background-size:cover;
    background-position:center;

    display:flex;
    align-items:center;

}

.hero-container{

    display:grid;
    grid-template-columns:1fr 1fr;
    align-items:center;
    gap:60px;

}

.hero-text h1{

    font-size:72px;
    color:var(--white);
    font-family:'Playfair Display',serif;
    line-height:1.15;
    margin:20px 0;

}

.hero-text p{

    color:#e8e8e8;
    line-height:1.8;
    margin-bottom:35px;
    max-width:550px;

}

.hero-buttons{

    display:flex;
    gap:20px;
    margin-bottom:50px;

}

.hero-image img{

    max-width:100%;
    animation:float 4s ease-in-out infinite;

}

.hero-info{

    display:flex;
    gap:40px;

}

.info-box h3{

    color:var(--secondary);
    font-size:34px;

}

.info-box span{

    color:var(--white);
    font-size:15px;

}

/*======================================
        ANIMATION
======================================*/

@keyframes float{

    0%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-12px);
    }

    100%{
        transform:translateY(0);
    }

}

/*======================================
        RESPONSIVE
======================================*/

@media(max-width:992px){

    .hero-container{

        grid-template-columns:1fr;
        text-align:center;

    }

    .hero-text p{

        margin:auto auto 35px;

    }

    .hero-buttons,
    .hero-info{

        justify-content:center;

    }

    .hero-text h1{

        font-size:55px;

    }

}

@media(max-width:768px){

    nav{

        flex-direction:column;
        height:auto;
        padding:20px 0;

    }

    .nav-links{

        flex-wrap:wrap;
        justify-content:center;
        gap:18px;
        margin:20px 0;

    }

    .hero-text h1{

        font-size:42px;

    }

    .section-title h2{

        font-size:34px;

    }

}

@media(max-width:480px){

    .hero-buttons{

        flex-direction:column;

    }

    .hero-info{

        flex-direction:column;
        gap:20px;

    }

}
/*======================================
        FEATURED DISHES
======================================*/

.featured-dishes{
    background:#ffffff;
}

.section-header{
    text-align:center;
    margin-bottom:70px;
}

.section-header h2{
    font-size:48px;
    font-family:'Playfair Display',serif;
    margin:15px 0;
    color:var(--dark);
}

.section-header p{
    max-width:650px;
    margin:auto;
    color:var(--gray);
    line-height:1.8;
}

.dish-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:35px;
}

.dish-card{
    background:#fff;
    border-radius:25px;
    overflow:hidden;
    box-shadow:var(--shadow);
    transition:.4s;
}

.dish-card:hover{
    transform:translateY(-12px);
}

.dish-image{
    overflow:hidden;
}

.dish-image img{
    height:260px;
    object-fit:cover;
    transition:.5s;
}

.dish-card:hover .dish-image img{
    transform:scale(1.08);
}

.dish-content{
    padding:30px;
}

.dish-category{
    display:inline-block;
    color:var(--primary);
    font-weight:600;
    margin-bottom:12px;
}

.dish-content h3{
    font-size:28px;
    font-family:'Playfair Display',serif;
    margin-bottom:15px;
}

.dish-content p{
    color:var(--gray);
    line-height:1.8;
    margin-bottom:25px;
}

.dish-footer{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.dish-footer h4{
    color:var(--primary);
    font-size:28px;
}

.dish-footer a{
    background:var(--primary);
    color:#fff;
    padding:12px 28px;
    border-radius:40px;
    transition:.3s;
}

.dish-footer a:hover{
    background:#b71c1c;
}

/*======================================
            ABOUT
======================================*/

.about{
    background:#f9f9f9;
}

.about-container{
    display:grid;
    grid-template-columns:1fr 1fr;
    align-items:center;
    gap:70px;
}

.about-image img{
    border-radius:25px;
    box-shadow:var(--shadow);
}

.about-content h2{
    font-size:48px;
    font-family:'Playfair Display',serif;
    margin:18px 0;
}

.about-content p{
    color:var(--gray);
    line-height:1.9;
    margin-bottom:35px;
}

.about-features{
    margin-bottom:35px;
}

.feature{
    display:flex;
    align-items:center;
    gap:15px;
    margin-bottom:18px;
}

.feature i{
    color:var(--primary);
    font-size:22px;
}

.feature span{
    font-size:17px;
    font-weight:500;
}

/*======================================
        RESPONSIVE
======================================*/

@media(max-width:992px){

    .about-container{
        grid-template-columns:1fr;
    }

    .about-content{
        text-align:center;
    }

}

@media(max-width:768px){

    .section-header h2,
    .about-content h2{
        font-size:36px;
    }

    .dish-grid{
        grid-template-columns:1fr;
    }

    .dish-content{
        padding:25px;
    }

}

@media(max-width:480px){

    .dish-footer{
        flex-direction:column;
        align-items:flex-start;
        gap:20px;
    }

    .feature{
        align-items:flex-start;
    }

}
/*======================================
        MENU SECTION
======================================*/

.menu-section{
    padding:100px 0;
    background:#fffaf5;
}

.menu-category{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:15px;
    flex-wrap:wrap;
    margin:50px 0;
}

.menu-category button{
    padding:14px 30px;
    border:none;
    outline:none;
    border-radius:50px;
    background:#ffffff;
    color:#333;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    box-shadow:0 8px 20px rgba(0,0,0,.08);
    transition:.3s;
}

.menu-category button:hover,
.menu-category button.active{
    background:var(--primary);
    color:var(--white);
}

.menu-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:30px;
}

.food-card{
    background:#fff;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 10px 25px rgba(0,0,0,.08);
    transition:.4s;
}

.food-card:hover{
    transform:translateY(-10px);
    box-shadow:0 18px 40px rgba(0,0,0,.15);
}

.food-card img{
    width:100%;
    height:240px;
    object-fit:cover;
    transition:.4s;
}

.food-card:hover img{
    transform:scale(1.08);
}

.food-info{
    padding:25px;
}

.food-info h3{
    font-size:28px;
    font-family:'Playfair Display',serif;
    color:var(--dark);
    margin-bottom:12px;
}

.food-info p{
    color:var(--gray);
    line-height:1.8;
    margin-bottom:22px;
}

.food-price{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.food-price span{
    font-size:26px;
    font-weight:700;
    color:var(--primary);
}

.food-price a{
    display:inline-block;
    padding:12px 26px;
    background:var(--primary);
    color:#fff;
    border-radius:40px;
    font-weight:600;
    transition:.3s;
}

.food-price a:hover{
    background:#b71c1c;
}

/*======================================
        RESPONSIVE
======================================*/

@media(max-width:992px){

    .menu-grid{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:768px){

    .menu-grid{
        grid-template-columns:1fr;
    }

    .food-info h3{
        font-size:24px;
    }

    .menu-category{
        gap:10px;
    }

    .menu-category button{
        padding:12px 22px;
        font-size:15px;
    }

}

@media(max-width:480px){

    .food-price{
        flex-direction:column;
        align-items:flex-start;
        gap:18px;
    }

    .food-card img{
        height:220px;
    }

}
/*======================================
        CHEF SECTION
======================================*/

.chef-section{
    padding:100px 0;
    background:#ffffff;
}

.chef-container{
    display:grid;
    grid-template-columns:1fr 1fr;
    align-items:center;
    gap:70px;
}

.chef-content .section-tag{
    display:inline-block;
    margin-bottom:15px;
}

.chef-content h2{
    font-family:'Playfair Display',serif;
    font-size:48px;
    color:var(--dark);
    line-height:1.2;
    margin-bottom:25px;
}

.chef-content p{
    color:var(--gray);
    line-height:1.9;
    margin-bottom:35px;
}

.chef-details{
    display:flex;
    flex-direction:column;
    gap:25px;
}

.chef-item{
    display:flex;
    align-items:flex-start;
    gap:20px;
    padding:20px;
    background:#fff;
    border-radius:18px;
    box-shadow:var(--shadow);
}

.chef-item i{
    width:60px;
    height:60px;
    background:var(--primary);
    color:#fff;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:24px;
}

.chef-item h4{
    font-size:22px;
    margin-bottom:8px;
    color:var(--dark);
}

.chef-item p{
    margin:0;
    color:var(--gray);
}

.chef-image img{
    width:100%;
    border-radius:25px;
    box-shadow:var(--shadow);
}

/*======================================
        GALLERY SECTION
======================================*/

.gallery-section{
    padding:100px 0;
    background:#f8f8f8;
}

.gallery-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.gallery-item{
    overflow:hidden;
    border-radius:20px;
    box-shadow:var(--shadow);
}

.gallery-item img{
    width:100%;
    height:280px;
    object-fit:cover;
    transition:.5s;
}

.gallery-item:hover img{
    transform:scale(1.08);
}

/*======================================
        RESPONSIVE
======================================*/

@media(max-width:992px){

    .chef-container{
        grid-template-columns:1fr;
        text-align:center;
    }

    .chef-details{
        align-items:center;
    }

    .gallery-grid{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:768px){

    .chef-content h2{
        font-size:36px;
    }

    .gallery-grid{
        grid-template-columns:1fr;
    }

    .gallery-item img{
        height:240px;
    }

}

@media(max-width:480px){

    .chef-item{
        flex-direction:column;
        align-items:center;
        text-align:center;
    }

    .chef-item h4{
        font-size:20px;
    }

}
/*======================================
        TESTIMONIALS SECTION
======================================*/

.testimonials{
    padding:100px 0;
    background:#fff;
}

.testimonial-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:30px;
    margin-top:60px;
}

.testimonial-card{
    background:#ffffff;
    padding:35px;
    border-radius:20px;
    box-shadow:var(--shadow);
    transition:.4s ease;
}

.testimonial-card:hover{
    transform:translateY(-10px);
}

.stars{
    color:var(--secondary);
    margin-bottom:20px;
    font-size:18px;
}

.testimonial-card p{
    color:var(--gray);
    line-height:1.9;
    margin-bottom:25px;
}

.customer{
    display:flex;
    align-items:center;
    gap:15px;
}

.customer img{
    width:65px;
    height:65px;
    border-radius:50%;
    object-fit:cover;
}

.customer h4{
    font-size:18px;
    color:var(--dark);
}

.customer span{
    color:var(--gray);
    font-size:14px;
}

/*======================================
        RESERVATION SECTION
======================================*/

.reservation{
    padding:100px 0;
    background:#fff7f2;
}

.reservation-container{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:60px;
    align-items:center;
}

.reservation-content h2{
    font-size:48px;
    font-family:'Playfair Display',serif;
    color:var(--dark);
    margin:20px 0;
}

.reservation-content p{
    color:var(--gray);
    line-height:1.8;
}

.reservation-form{
    background:#fff;
    padding:40px;
    border-radius:20px;
    box-shadow:var(--shadow);
}

.form-group{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
    margin-bottom:20px;
}

.reservation-form input,
.reservation-form select,
.reservation-form textarea{
    width:100%;
    padding:16px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:16px;
    outline:none;
    transition:.3s;
}

.reservation-form input:focus,
.reservation-form select:focus,
.reservation-form textarea:focus{
    border-color:var(--primary);
}

.reservation-form textarea{
    resize:none;
    margin-bottom:20px;
}

.reservation-form button{
    width:100%;
    padding:16px;
    border:none;
    border-radius:10px;
    background:var(--primary);
    color:#fff;
    font-size:17px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

.reservation-form button:hover{
    background:#b71c1c;
}

/*======================================
        RESPONSIVE
======================================*/

@media(max-width:992px){

    .testimonial-grid{
        grid-template-columns:1fr;
    }

    .reservation-container{
        grid-template-columns:1fr;
    }

}

@media(max-width:768px){

    .reservation-content h2{
        font-size:36px;
    }

    .form-group{
        grid-template-columns:1fr;
    }

    .reservation-form{
        padding:30px;
    }

}

@media(max-width:480px){

    .testimonial-card{
        padding:25px;
    }

    .customer{
        flex-direction:column;
        text-align:center;
    }

}
/*======================================
        CONTACT SECTION
======================================*/

.contact-section{
    padding:100px 0;
    background:#ffffff;
}

.contact-container{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:30px;
    margin-top:60px;
}

.contact-card{
    background:#fff;
    padding:35px 25px;
    text-align:center;
    border-radius:20px;
    box-shadow:var(--shadow);
    transition:.4s ease;
}

.contact-card:hover{
    transform:translateY(-10px);
}

.contact-card i{
    width:75px;
    height:75px;
    background:var(--primary);
    color:#fff;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    margin:0 auto 25px;
    font-size:28px;
}

.contact-card h3{
    font-size:26px;
    font-family:'Playfair Display',serif;
    color:var(--dark);
    margin-bottom:15px;
}

.contact-card p{
    color:var(--gray);
    line-height:1.8;
    font-size:15px;
}

/*======================================
        CONTACT EXTRA
======================================*/

.contact-section .section-title{
    margin-bottom:20px;
}

.contact-section .section-title h2{
    font-size:48px;
    color:var(--dark);
    font-family:'Playfair Display',serif;
}

.contact-section .section-title p{
    max-width:650px;
    margin:15px auto 0;
    color:var(--gray);
    line-height:1.8;
}

/*======================================
        RESPONSIVE
======================================*/

@media(max-width:1100px){

    .contact-container{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:768px){

    .contact-container{
        grid-template-columns:1fr;
    }

    .contact-section{
        padding:80px 0;
    }

    .contact-section .section-title h2{
        font-size:36px;
    }

    .contact-card{
        padding:30px 20px;
    }

}

@media(max-width:480px){

    .contact-card i{
        width:65px;
        height:65px;
        font-size:24px;
    }

    .contact-card h3{
        font-size:22px;
    }

    .contact-card p{
        font-size:14px;
    }

}
/*======================================
              FOOTER
======================================*/

footer{
    background:#111111;
    color:#ffffff;
    padding:80px 0 30px;
}

.footer-container{
    display:grid;
    grid-template-columns:2fr 1fr 1fr;
    gap:50px;
    margin-bottom:50px;
}

.footer-about h2{
    font-family:'Playfair Display',serif;
    font-size:36px;
    margin-bottom:20px;
    color:var(--white);
}

.footer-about p{
    color:#cccccc;
    line-height:1.9;
    max-width:400px;
}

.footer-links h3,
.footer-social h3{
    font-size:24px;
    font-family:'Playfair Display',serif;
    margin-bottom:25px;
    color:var(--white);
}

.footer-links ul{
    padding:0;
}

.footer-links ul li{
    margin-bottom:15px;
}

.footer-links ul li a{
    color:#cccccc;
    transition:.3s ease;
}

.footer-links ul li a:hover{
    color:var(--secondary);
    padding-left:8px;
}

.social-icons{
    display:flex;
    gap:15px;
    flex-wr
